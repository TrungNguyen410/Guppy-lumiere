services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Thiếu DB_ROOT_PASS trong .env}
      MYSQL_DATABASE: ${DB_NAME:?Thiếu DB_NAME trong .env}
      MYSQL_USER: ${DB_USER:?Thiếu DB_USER trong .env}
      MYSQL_PASSWORD: ${DB_PASS:?Thiếu DB_PASS trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Ping qua TCP: máy chủ tạm lúc khởi tạo CSDL không mở TCP nên chưa bị tính là sẵn sàng
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?Thiếu DB_URL trong .env}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Tùy chọn, chỉ chạy khi thêm --profile tuy-chon
  phpmyadmin:
    image: phpmyadmin:latest
    profiles: ["tuy-chon"]
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
